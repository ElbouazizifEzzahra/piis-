backend:
  build:
    context: ./backend
    dockerfile: Dockerfile   # ou Dockerfile.prod en staging/prod
  ports:
    - "8000:8000"
  env_file: ../.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - ./backend:/app   # hot reload en dev uniquement